# Render blueprint for the RenovateConnect API.
#   - web service (Docker) serving the Express API
#   - managed Postgres
#
# Secrets (sync: false / set in the dashboard): ANTHROPIC_API_KEY,
# NVIDIA_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, the AWS_*/S3_BUCKET
# set, and the APNS_* set. JWT_SECRET is generated by Render.
#
# The web app (web/) deploys separately (Vercel); point renovateconnect.com at
# it and this API at api.renovateconnect.com (see LAUNCH_READINESS.md).
#
# COST: web service + Postgres are on the Free plan (deliberate, 2026-08-07).
# The cron job can't be free (Render doesn't offer free cron instances), so it
# stays on Starter. ⚠️ Free Postgres is deleted 30 days after creation + a
# 14-day grace period unless upgraded before then — fine for pre-launch
# testing, NOT fine once there's real user data. Upgrade both plans before
# accepting real signups.
#
# Key Value (Redis-compatible) backs the rate limiter's counters so they
# survive the free web service's restarts/cold-starts instead of resetting an
# in-memory count — a live brute-force test against /auth/login went
# unthrottled before this was added (see api/src/middleware/rateLimit.js).
# Also free (2026-08-13); no external access needed, so ipAllowList is empty —
# only the api service (same account, private network) can reach it.

databases:
  - name: renovate-connect-db
    databaseName: renovate_connect
    user: renovate
    plan: free

services:
  - type: keyvalue
    name: renovate-connect-redis
    plan: free
    ipAllowList: []

  - type: web
    name: renovate-connect-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: renovate-connect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: renovate-connect-redis
          type: keyvalue
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://renovateconnect.com
      # Both hosts: the apex 308-redirects to www, so a browser's Origin is
      # always the www one. app.js pairs www/apex automatically now, but listing
      # both keeps the intent obvious to whoever reads this next.
      - key: WEB_ORIGINS
        value: https://renovateconnect.com,https://www.renovateconnect.com
      - key: APNS_PRODUCTION
        value: "true"
      # Shared with the listing-sweep cron below so it can authenticate.
      - key: INTERNAL_API_KEY
        generateValue: true
      # Secrets — set in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shared key for both AI paths (services/aiProvider.js). Chat only falls
      # back to Anthropic when this is unset; the photo estimator (vision)
      # falls back on ANY runtime failure too, not just when unset — see the
      # comment above estimateRenovationCost in services/ai.js.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_CHAT_MODEL
        value: deepseek-ai/deepseek-v4-flash-0731
      - key: NVIDIA_VISION_MODEL
        value: nvidia/nemotron-nano-12b-v2-vl
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Transactional email (SendGrid) — email verification + password reset.
      # NEVER put the key here: this file is committed to git. `sync: false`
      # means "set this value in the Render dashboard", which is where secrets
      # belong. EMAIL_FROM isn't secret, so it can live in the blueprint.
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: no-reply@renovateconnect.com
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_KEY
        sync: false

  # Daily listing-lifecycle sweep: emails/pushes contractors whose free month is
  # about to end, and those whose listing has just gone hidden. Without it a
  # business is silently delisted at day 30 and never told why the leads stopped.
  # Each notice is stamped send-once, so a retry or overlapping run is harmless.
  # 15:00 UTC ≈ 8am PT — a business-hours nudge, not a 3am one.
  - type: cron
    name: renovate-connect-listing-sweep
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: starter
    schedule: "0 15 * * *"
    dockerCommand: >
      sh -c 'curl -fsS -X POST "$API_BASE_URL/internal/listing-sweep"
      -H "x-internal-key: $INTERNAL_API_KEY"'
    envVars:
      - key: API_BASE_URL
        value: https://api.renovateconnect.com
      # Must match the web service's generated key above.
      - key: INTERNAL_API_KEY
        fromService:
          name: renovate-connect-api
          type: web
          envVarKey: INTERNAL_API_KEY
