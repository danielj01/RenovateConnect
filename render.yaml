# Render blueprint for the RenovateConnect API.
#   - web service (Docker) serving the Express API
#   - managed Postgres
#
# Secrets (sync: false / set in the dashboard): ANTHROPIC_API_KEY,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, the AWS_*/S3_BUCKET set, and the
# APNS_* set. JWT_SECRET is generated by Render.
#
# The web app (web/) deploys separately (Vercel); point renovateconnect.com at
# it and this API at api.renovateconnect.com (see LAUNCH_READINESS.md).

databases:
  - name: renovate-connect-db
    databaseName: renovate_connect
    user: renovate
    plan: basic-256mb

services:
  - type: web
    name: renovate-connect-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: renovate-connect-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://renovateconnect.com
      - key: WEB_ORIGINS
        value: https://renovateconnect.com
      - key: APNS_PRODUCTION
        value: "true"
      # Shared with the listing-sweep cron below so it can authenticate.
      - key: INTERNAL_API_KEY
        generateValue: true
      # Secrets — set in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Transactional email (SendGrid) — email verification + password reset.
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_KEY
        sync: false

  # Daily listing-lifecycle sweep: emails/pushes contractors whose free month is
  # about to end, and those whose listing has just gone hidden. Without it a
  # business is silently delisted at day 30 and never told why the leads stopped.
  # Each notice is stamped send-once, so a retry or overlapping run is harmless.
  # 15:00 UTC ≈ 8am PT — a business-hours nudge, not a 3am one.
  - type: cron
    name: renovate-connect-listing-sweep
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: starter
    schedule: "0 15 * * *"
    dockerCommand: >
      sh -c 'curl -fsS -X POST "$API_BASE_URL/internal/listing-sweep"
      -H "x-internal-key: $INTERNAL_API_KEY"'
    envVars:
      - key: API_BASE_URL
        value: https://api.renovateconnect.com
      # Must match the web service's generated key above.
      - key: INTERNAL_API_KEY
        fromService:
          name: renovate-connect-api
          type: web
          envVarKey: INTERNAL_API_KEY
